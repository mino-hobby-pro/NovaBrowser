<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaBrowser</title>
    
    <!-- Scripts (既存のロジックを完全維持) -->
    <script src="check.js" defer></script>
    <script defer src="scripts/lstimer.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/vanjs-org/van/public/van-1.5.2.nomodule.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="uv/uv.bundle.js" defer></script>
    <script src="uv/uv.config.js" defer></script>
    <script src="scripts/tabs.mjs" type="module" defer></script>
    <script defer src="https://cdn.jsdelivr.net/gh/tf7software/Font-Awesome-pro-cdn@main/js/all.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --chrome-bg: #202124;
        --chrome-toolbar: #323639;
        --chrome-omnibox: #202124;
        --chrome-text: #f1f3f4;
        --chrome-text-muted: #9aa0a6;
        --chrome-hover-bg: rgba(255, 255, 255, 0.08);
        --chrome-blue: #8ab4f8;
        --chrome-separator: rgba(255, 255, 255, 0.15);

        /* ── タブ専用トークン ── */
        --tab-h: 34px;
        --tab-min-w: 80px;
        --tab-max-w: 240px;
        --tab-radius: 10px 10px 0 0;
        --tab-bg-idle: transparent;
        --tab-bg-hover: rgba(255,255,255,0.07);
        --tab-bg-active: #323639;
        --tab-text-idle: #9aa0a6;
        --tab-text-active: #f1f3f4;
        --tab-accent: #8ab4f8;
        --tab-close-r: 50%;
        --tab-shadow-active: 0 -1px 6px rgba(0,0,0,0.35);
        --tab-indicator: #8ab4f8;
        --tab-anim-dur: 200ms;
        --tab-anim-ease: cubic-bezier(0.4,0,0.2,1);
        --tab-strip-h: 42px;
        --tab-strip-bg: #202124;
        --tab-pin-w: 36px;
        --scroll-btn-w: 28px;
      }

      * { box-sizing: border-box; }

      body {
        padding: 0; margin: 0;
        height: 100vh; width: 100vw;
        display: flex; flex-direction: column;
        background-color: var(--chrome-bg);
        font-family: 'Roboto', sans-serif;
        overflow: hidden;
        color: var(--chrome-text);
      }

      /* =========================================
         起動アニメーション
      ========================================= */
      #loading-overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-color: var(--chrome-bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
      }

      .loader-content { text-align: center; }

      .nova-spinner {
        width: 60px; height: 60px;
        border: 3px solid transparent;
        border-top-color: var(--chrome-blue);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 24px;
        position: relative; display: inline-block;
      }
      .nova-spinner::before {
        content: "";
        position: absolute;
        top: 5px; left: 5px; right: 5px; bottom: 5px;
        border: 3px solid transparent;
        border-top-color: #f1f3f4;
        border-radius: 50%;
        animation: spin 2s linear infinite;
      }

      @keyframes spin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loading-text {
        font-weight: 300; font-size: 20px;
        letter-spacing: 1.5px; color: var(--chrome-text);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.6; transform: scale(0.98); }
        50%       { opacity: 1;   transform: scale(1); }
      }

      #loading-overlay.fade-out { opacity: 0; visibility: hidden; }

      /* =========================================
         ブラウザUI / ヘッダー
      ========================================= */
      header {
        background-color: var(--chrome-bg);
        display: flex; flex-direction: column;
        width: 100%; z-index: 100;
        user-select: none;
      }

      /* =========================================
         ★ 完璧タブストリップ ★
      ========================================= */
      .tab-strip {
        display: flex;
        align-items: flex-end;
        height: var(--tab-strip-h);
        background: var(--tab-strip-bg);
        padding: 0 4px;
        position: relative;
        overflow: hidden;          /* スクロールボタンで制御 */
      }

      /* 左右スクロールボタン */
      .tab-scroll-btn {
        flex-shrink: 0;
        width: var(--scroll-btn-w);
        height: var(--tab-strip-h);
        display: none;             /* タブが溢れたとき JS で flex 化 */
        align-items: center;
        justify-content: center;
        background: linear-gradient(to right, var(--tab-strip-bg) 60%, transparent);
        border: none;
        color: var(--chrome-text-muted);
        cursor: pointer;
        font-size: 14px;
        z-index: 5;
        transition: color var(--tab-anim-dur);
        padding: 0;
      }
      .tab-scroll-btn.right {
        background: linear-gradient(to left, var(--tab-strip-bg) 60%, transparent);
      }
      .tab-scroll-btn:hover { color: var(--chrome-text); }
      .tab-scroll-btn.visible { display: flex; }

      /* スクロール可能なタブ列 */
      #tab-scroll-area {
        flex: 1;
        display: flex;
        align-items: flex-end;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
        scroll-behavior: smooth;
        padding: 0 2px;
        /* マスクで端をふんわりフェード */
        -webkit-mask-image: linear-gradient(to right, transparent 0, #000 12px, #000 calc(100% - 12px), transparent 100%);
        mask-image:         linear-gradient(to right, transparent 0, #000 12px, #000 calc(100% - 12px), transparent 100%);
      }
      #tab-scroll-area::-webkit-scrollbar { display: none; }

      #tab-list {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        flex-shrink: 0;
        height: 100%;
        padding-bottom: 0;
      }

      /* ── タブアイテム本体 ── */
      .tab-item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 7px;
        height: var(--tab-h);
        padding: 0 8px 0 11px;
        min-width: var(--tab-min-w);
        max-width: var(--tab-max-w);
        flex: 1 1 var(--tab-min-w);
        background: var(--tab-bg-idle);
        color: var(--tab-text-idle);
        border: none;
        border-radius: var(--tab-radius);
        cursor: pointer;
        font-size: 12px;
        font-family: inherit;
        outline: none;
        /* 生まれてくるアニメーション */
        animation: tabSlideIn var(--tab-anim-dur) var(--tab-anim-ease);
        transition:
          background-color var(--tab-anim-dur) var(--tab-anim-ease),
          color            var(--tab-anim-dur) var(--tab-anim-ease),
          box-shadow       var(--tab-anim-dur) var(--tab-anim-ease),
          min-width        var(--tab-anim-dur) var(--tab-anim-ease),
          max-width        var(--tab-anim-dur) var(--tab-anim-ease);
        /* ドラッグ中は上に浮く */
        will-change: transform, opacity;
      }

      @keyframes tabSlideIn {
        from { opacity: 0; transform: translateY(6px) scaleX(0.9); }
        to   { opacity: 1; transform: translateY(0)  scaleX(1); }
      }

      /* ホバー */
      .tab-item:not(.selectedTab):hover {
        background: var(--tab-bg-hover);
        color: var(--chrome-text);
      }

      /* アクティブタブ */
      .tab-item.selectedTab {
        background: var(--tab-bg-active);
        color: var(--tab-text-active);
        box-shadow: var(--tab-shadow-active);
        z-index: 3;
      }

      /* アクティブタブの上部インジケーターライン */
      .tab-item.selectedTab::before {
        content: "";
        position: absolute;
        top: 0; left: 12px; right: 12px;
        height: 2px;
        background: var(--tab-indicator);
        border-radius: 0 0 2px 2px;
        animation: indicatorSlide var(--tab-anim-dur) var(--tab-anim-ease);
      }
      @keyframes indicatorSlide {
        from { transform: scaleX(0); opacity: 0; }
        to   { transform: scaleX(1); opacity: 1; }
      }

      /* 隣接タブとの縦区切り線（アクティブ・ホバー隣は非表示） */
      .tab-item::after {
        content: "";
        position: absolute;
        right: -1px; top: 20%; bottom: 20%;
        width: 1px;
        background: var(--chrome-separator);
        border-radius: 1px;
        transition: opacity var(--tab-anim-dur);
      }
      .tab-item:last-child::after                                { opacity: 0; }
      .tab-item:hover::after,
      .tab-item.selectedTab::after,
      .tab-item:hover + .tab-item::after,
      .tab-item.selectedTab + .tab-item::after                   { opacity: 0; }

      /* ファビコン */
      .tab-favicon {
        width: 16px; height: 16px;
        flex-shrink: 0;
        border-radius: 3px;
        object-fit: contain;
        transition: opacity 0.2s;
      }
      .tab-favicon.hidden { display: none; }

      /* ローディングスピナー（ファビコン位置に表示） */
      .tab-spinner {
        width: 14px; height: 14px;
        flex-shrink: 0;
        border: 2px solid rgba(138,180,248,0.3);
        border-top-color: var(--tab-accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        display: none;
      }
      .tab-item.loading .tab-spinner  { display: block; }
      .tab-item.loading .tab-favicon  { display: none; }

      /* タイトル */
      .tab-title {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: left;
        font-size: 12px;
        letter-spacing: 0.01em;
      }

      /* ミュートアイコン（タブの音声状態） */
      .tab-mute-btn {
        flex-shrink: 0;
        background: transparent;
        border: none;
        color: var(--chrome-text-muted);
        width: 18px; height: 18px;
        border-radius: 50%;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        cursor: pointer;
        transition: background var(--tab-anim-dur), color var(--tab-anim-dur);
        padding: 0;
      }
      .tab-item.audible .tab-mute-btn   { display: flex; }
      .tab-mute-btn:hover { background: rgba(255,255,255,0.15); color: var(--chrome-text); }

      /* 閉じるボタン */
      .tab-close {
        flex-shrink: 0;
        background: transparent;
        border: none;
        color: var(--chrome-text-muted);
        width: 20px; height: 20px;
        border-radius: var(--tab-close-r);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
        opacity: 0;
        transition:
          opacity      var(--tab-anim-dur),
          background   var(--tab-anim-dur),
          color        var(--tab-anim-dur),
          transform    var(--tab-anim-dur);
        padding: 0;
      }
      .tab-item:hover .tab-close,
      .tab-item.selectedTab .tab-close { opacity: 1; }
      .tab-close:hover {
        background: rgba(255,255,255,0.2);
        color: var(--chrome-text);
        transform: scale(1.1);
      }

      /* タブ閉じるときアニメーション */
      .tab-item.closing {
        animation: tabSlideOut var(--tab-anim-dur) var(--tab-anim-ease) forwards;
        pointer-events: none;
      }
      @keyframes tabSlideOut {
        from { opacity: 1; transform: scaleX(1) translateY(0); max-width: var(--tab-max-w); }
        to   { opacity: 0; transform: scaleX(0.8) translateY(4px); max-width: 0; min-width: 0; padding: 0; margin: 0; }
      }

      /* ── ピン留めタブ ── */
      .tab-item.pinned {
        min-width: var(--tab-pin-w);
        max-width: var(--tab-pin-w);
        padding: 0;
        justify-content: center;
        flex: 0 0 var(--tab-pin-w);
      }
      .tab-item.pinned .tab-title,
      .tab-item.pinned .tab-close { display: none; }
      .tab-item.pinned .tab-favicon { margin: 0; }

      /* ドラッグ中タブ */
      .tab-item.dragging {
        opacity: 0.5;
        background: var(--tab-bg-hover) !important;
      }
      .tab-item.drag-over {
        border-left: 2px solid var(--tab-accent);
      }

      /* 新規タブボタン */
      #new-tab {
        flex-shrink: 0;
        background: transparent;
        border: none;
        color: var(--chrome-text-muted);
        width: 28px; height: 28px;
        margin: 0 4px 3px 2px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        font-size: 18px;
        transition:
          background var(--tab-anim-dur),
          color      var(--tab-anim-dur),
          transform  var(--tab-anim-dur);
      }
      #new-tab:hover {
        background: var(--chrome-hover-bg);
        color: var(--chrome-text);
        transform: rotate(90deg);
      }
      #new-tab span { display: none; }

      /* ── 右クリックコンテキストメニュー ── */
      #tab-context-menu {
        position: fixed;
        background: #2c2e31;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        padding: 6px 0;
        box-shadow: 0 12px 40px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.3);
        z-index: 99998;
        min-width: 210px;
        display: none;
        animation: ctxFadeIn 0.12s var(--tab-anim-ease);
        backdrop-filter: blur(12px);
      }
      #tab-context-menu.active { display: block; }
      @keyframes ctxFadeIn {
        from { opacity: 0; transform: scale(0.94) translateY(-4px); }
        to   { opacity: 1; transform: scale(1)    translateY(0); }
      }
      .ctx-item {
        display: flex; align-items: center; gap: 12px;
        padding: 9px 16px;
        font-size: 12.5px;
        color: var(--chrome-text);
        cursor: pointer;
        transition: background var(--tab-anim-dur);
        border-radius: 0;
      }
      .ctx-item:hover { background: rgba(255,255,255,0.08); }
      .ctx-item i {
        font-size: 14px;
        color: var(--chrome-text-muted);
        width: 18px; text-align: center;
      }
      .ctx-separator {
        height: 1px;
        background: rgba(255,255,255,0.1);
        margin: 5px 0;
      }
      .ctx-item.danger { color: #f28b82; }
      .ctx-item.danger i { color: #f28b82; }
      .ctx-item.danger:hover { background: rgba(242,139,130,0.1); }

      /* =========================================
         ツールバー (既存ほぼ維持)
      ========================================= */
      .toolbar {
        background-color: var(--chrome-toolbar);
        display: flex; align-items: center;
        padding: 4px 8px; height: 44px; gap: 8px;
        border-bottom: 1px solid #1c1d1f;
      }

      .nav-btns { display: flex; gap: 2px; }
      .nav-btns button, .menu-btns button {
        background: transparent; border: none; color: var(--chrome-text);
        font-size: 18px; cursor: pointer; width: 32px; height: 32px;
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        transition: background var(--tab-anim-dur);
      }
      .nav-btns button:hover, .menu-btns button:hover { background-color: var(--chrome-hover-bg); }

      #url-form { flex-grow: 1; display: flex; align-items: center; }
      .omnibox-wrapper {
        display: flex; align-items: center;
        background-color: var(--chrome-omnibox);
        border-radius: 999px; width: 100%; height: 32px;
        padding: 0 12px; border: 1px solid transparent;
        transition: border-color var(--tab-anim-dur);
      }
      .omnibox-wrapper:focus-within { border-color: var(--chrome-blue); }

      .incognito-icon { color: var(--chrome-text-muted); font-size: 13px; margin-right: 10px; }

      #url-input {
        flex-grow: 1; background: transparent; border: none;
        color: var(--chrome-text); font-size: 13.5px;
        outline: none;
      }

      #tab-view {
        flex-grow: 1; background-color: #323639;
        position: relative; width: 100%; height: 100%;
      }
      .tab-frame {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%;
        border: none; background-color: #fff;
      }

      /* =========================================
         オプションメニュー
      ========================================= */
      #menu-overlay {
        position: absolute; top: 84px; right: 10px;
        background-color: #28292c; border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px; padding: 8px 0; display: none;
        flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        z-index: 1000; min-width: 240px;
      }
      #menu-overlay.active { display: flex; animation: menuFadeIn 0.15s ease-out; }
      @keyframes menuFadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to   { opacity: 1; transform: scale(1); }
      }
      .option {
        padding: 10px 20px; color: var(--chrome-text);
        font-size: 13px; cursor: pointer;
        display: flex; align-items: center; gap: 12px;
        transition: background var(--tab-anim-dur);
      }
      .option:hover { background-color: var(--chrome-hover-bg); }
      .option i { color: var(--chrome-text-muted); font-size: 16px; width: 20px; text-align: center; }

      /* =========================================
         タブカウントバッジ（10タブ以上のとき）
      ========================================= */
      #tab-count-badge {
        flex-shrink: 0;
        font-size: 10px;
        font-weight: 500;
        color: var(--chrome-text-muted);
        padding: 2px 6px;
        border-radius: 6px;
        background: rgba(255,255,255,0.06);
        margin-bottom: 4px;
        display: none;
        letter-spacing: 0.5px;
        align-self: center;
      }
      #tab-count-badge.visible { display: block; }
    </style>
  </head>

  <body>
    <!-- 起動時ローディング画面 -->
    <div id="loading-overlay">
      <div class="loader-content">
        <div class="nova-spinner"></div>
        <div class="loading-text">NovaBrowser is loading...</div>
      </div>
    </div>

    <!-- JS依存用ダミー -->
    <div id="nav" style="display:none;"></div>
    <div id="main-content" style="display:none;"></div>

    <header>
      <!-- ★ 完璧タブストリップ ★ -->
      <div class="tab-strip">
        <!-- 左スクロールボタン -->
        <button class="tab-scroll-btn left" id="tab-scroll-left" title="スクロール左">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </button>

        <!-- スクロール可能エリア -->
        <div id="tab-scroll-area">
          <div id="tab-list"></div>
        </div>

        <!-- 右スクロールボタン -->
        <button class="tab-scroll-btn right" id="tab-scroll-right" title="スクロール右">
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </button>

        <!-- タブ数バッジ -->
        <span id="tab-count-badge"></span>

        <!-- 新規タブ -->
        <button id="new-tab" title="新しいタブ (Ctrl+T)">
          <ion-icon name="add-outline"></ion-icon>
          <span>New Tab</span>
        </button>
      </div>

      <!-- ツールバー -->
      <div class="toolbar">
        <div class="nav-btns">
          <button id="page-back"    title="戻る"><ion-icon name="arrow-back-outline"></ion-icon></button>
          <button id="page-forward" title="進む"><ion-icon name="arrow-forward-outline"></ion-icon></button>
          <button id="page-refresh" title="再読み込み"><ion-icon name="refresh-outline"></ion-icon></button>
          <button onclick="window.location.href='/'" title="ホーム"><ion-icon name="home-outline"></ion-icon></button>
        </div>

        <form id="url-form">
          <div class="omnibox-wrapper">
            <i class="fa-solid fa-user-secret incognito-icon"></i>
            <input type="text" id="url-input" placeholder="Search or type a URL" autocomplete="off" spellcheck="false" />
          </div>
        </form>

        <div class="menu-btns">
          <button id="options-btn" title="オプション"><ion-icon name="ellipsis-vertical"></ion-icon></button>
        </div>
      </div>
    </header>

    <div id="tab-view"></div>

    <!-- オプションメニュー -->
    <div id="menu-overlay">
      <div class="option" id="devtools-option"><i class="fa-solid fa-code"></i> Developer Tools</div>
      <div class="option" id="abc-option"><i class="fa-solid fa-mask"></i> Open in about:blank</div>
      <div class="option" id="git-option"><i class="fa-brands fa-github"></i> GitHub Source</div>
    </div>

    <!-- ★ タブ右クリックコンテキストメニュー ★ -->
    <div id="tab-context-menu">
      <div class="ctx-item" id="ctx-new-tab">
        <i class="fa-solid fa-plus"></i> 新しいタブ
      </div>
      <div class="ctx-separator"></div>
      <div class="ctx-item" id="ctx-reload">
        <i class="fa-solid fa-rotate-right"></i> 再読み込み
      </div>
      <div class="ctx-item" id="ctx-duplicate">
        <i class="fa-regular fa-clone"></i> タブを複製
      </div>
      <div class="ctx-item" id="ctx-pin">
        <i class="fa-solid fa-thumbtack"></i> タブをピン留め
      </div>
      <div class="ctx-item" id="ctx-mute">
        <i class="fa-solid fa-volume-xmark"></i> タブをミュート
      </div>
      <div class="ctx-separator"></div>
      <div class="ctx-item" id="ctx-close-others">
        <i class="fa-solid fa-xmark"></i> 他のタブを閉じる
      </div>
      <div class="ctx-item danger" id="ctx-close">
        <i class="fa-solid fa-trash-can"></i> タブを閉じる
      </div>
    </div>

    <script>
      /* =========================================
         メニューの開閉
      ========================================= */
      const optionsBtn = document.getElementById("options-btn");
      const overlay    = document.getElementById("menu-overlay");
      optionsBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        overlay.classList.toggle("active");
      });
      document.addEventListener("click", () => overlay.classList.remove("active"));

      /* =========================================
         起動シーケンス
      ========================================= */
      window.addEventListener("load", () => {
        const loader = document.getElementById("loading-overlay");
        setTimeout(() => {
          loader.classList.add("fade-out");
          setTimeout(() => loader.remove(), 600);
        }, 800);
      });

      /* =========================================
         ★ 完璧タブエンジン ★
      ========================================= */
      (() => {
        /* ── 状態 ── */
        const HOME_URL     = "https://nova-search.edgeone.app/";
        const HOME_DISPLAY = "nova://home";

        let tabs       = [];          // { id, title, url, favicon, loading, pinned, audible, muted }
        let activeId   = null;
        let nextId     = 1;
        let ctxTargetId = null;

        /* ── DOM参照 ── */
        const tabList        = document.getElementById("tab-list");
        const tabView        = document.getElementById("tab-view");
        const urlInput       = document.getElementById("url-input");
        const urlForm        = document.getElementById("url-form");
        const newTabBtn      = document.getElementById("new-tab");
        const scrollArea     = document.getElementById("tab-scroll-area");
        const btnLeft        = document.getElementById("tab-scroll-left");
        const btnRight       = document.getElementById("tab-scroll-right");
        const badge          = document.getElementById("tab-count-badge");
        const ctxMenu        = document.getElementById("tab-context-menu");
        const pageBack       = document.getElementById("page-back");
        const pageForward    = document.getElementById("page-forward");
        const pageRefresh    = document.getElementById("page-refresh");

        /* ── ユーティリティ ── */
        function genId() { return nextId++; }

        function displayUrl(url) {
          if (!url) return "";
          return url === HOME_URL ? HOME_DISPLAY : url;
        }

        function getDefaultFavicon(url) {
          try {
            const u = new URL(url);
            return `https://www.google.com/s2/favicons?domain=${u.hostname}&sz=32`;
          } catch { return ""; }
        }

        /* ── タブ検索 ── */
        function findTab(id) { return tabs.find(t => t.id === id); }
        function findFrame(id) { return document.getElementById(`frame-${id}`); }
        function findTabEl(id) { return document.getElementById(`tab-${id}`); }

        /* ── スクロールボタン制御 ── */
        function updateScrollBtns() {
          const el = scrollArea;
          const overflowing = el.scrollWidth > el.clientWidth + 4;
          btnLeft.classList.toggle("visible", overflowing && el.scrollLeft > 4);
          btnRight.classList.toggle("visible", overflowing && el.scrollLeft < el.scrollWidth - el.clientWidth - 4);

          const count = tabs.length;
          if (count >= 10) {
            badge.textContent = `${count}`;
            badge.classList.add("visible");
          } else {
            badge.classList.remove("visible");
          }
        }

        btnLeft.addEventListener("click", () => {
          scrollArea.scrollBy({ left: -160, behavior: "smooth" });
          setTimeout(updateScrollBtns, 350);
        });
        btnRight.addEventListener("click", () => {
          scrollArea.scrollBy({ left: 160, behavior: "smooth" });
          setTimeout(updateScrollBtns, 350);
        });
        scrollArea.addEventListener("scroll", updateScrollBtns);
        window.addEventListener("resize", updateScrollBtns);

        /* ── タブ要素を生成 ── */
        function createTabEl(tab) {
          const el = document.createElement("div");
          el.id        = `tab-${tab.id}`;
          el.className = "tab-item";
          el.draggable = true;
          el.tabIndex  = 0;
          el.setAttribute("role", "tab");
          el.setAttribute("aria-selected", "false");
          el.title = tab.title || tab.url || "New Tab";

          /* スピナー */
          const spinner = document.createElement("div");
          spinner.className = "tab-spinner";

          /* ファビコン */
          const favicon = document.createElement("img");
          favicon.className = "tab-favicon";
          favicon.src       = tab.favicon || "";
          favicon.alt       = "";
          favicon.onerror   = () => { favicon.style.display = "none"; };
          if (!tab.favicon) favicon.style.display = "none";

          /* タイトル */
          const title = document.createElement("span");
          title.className   = "tab-title";
          title.textContent = tab.title || "New Tab";

          /* ミュートボタン */
          const muteBtn = document.createElement("button");
          muteBtn.className = "tab-mute-btn";
          muteBtn.title     = "ミュート";
          muteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
          muteBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleMute(tab.id);
          });

          /* 閉じるボタン */
          const closeBtn = document.createElement("button");
          closeBtn.className = "tab-close";
          closeBtn.title     = "タブを閉じる";
          closeBtn.innerHTML = "×";
          closeBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            closeTab(tab.id);
          });

          el.append(spinner, favicon, title, muteBtn, closeBtn);

          /* クリックでアクティブ化 */
          el.addEventListener("click", () => activateTab(tab.id));

          /* Ctrl+W でアクティブタブを閉じる */
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") activateTab(tab.id);
          });

          /* 右クリック → コンテキストメニュー */
          el.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            showCtxMenu(e, tab.id);
          });

          /* ── ドラッグ&ドロップでタブ並び替え ── */
          el.addEventListener("dragstart", (e) => {
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", tab.id);
            setTimeout(() => el.classList.add("dragging"), 0);
          });
          el.addEventListener("dragend", () => {
            el.classList.remove("dragging");
            document.querySelectorAll(".tab-item.drag-over").forEach(t => t.classList.remove("drag-over"));
          });
          el.addEventListener("dragover", (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            el.classList.add("drag-over");
          });
          el.addEventListener("dragleave", () => el.classList.remove("drag-over"));
          el.addEventListener("drop", (e) => {
            e.preventDefault();
            el.classList.remove("drag-over");
            const fromId = parseInt(e.dataTransfer.getData("text/plain"), 10);
            const toId   = tab.id;
            if (fromId !== toId) reorderTab(fromId, toId);
          });

          /* マウスホイールでスクロール */
          el.addEventListener("wheel", (e) => {
            e.preventDefault();
            scrollArea.scrollBy({ left: e.deltaY * 2, behavior: "smooth" });
          }, { passive: false });

          return el;
        }

        /* ── UI 更新：全タブ再描画 ── */
        function renderTabs() {
          tabList.innerHTML = "";
          tabs.forEach(tab => {
            const el = createTabEl(tab);
            if (tab.id === activeId)      el.classList.add("selectedTab");
            if (tab.loading)              el.classList.add("loading");
            if (tab.pinned)               el.classList.add("pinned");
            if (tab.audible && !tab.muted) el.classList.add("audible");
            el.setAttribute("aria-selected", tab.id === activeId ? "true" : "false");
            el.title = tab.title || "New Tab";
            tabList.appendChild(el);
          });
          updateScrollBtns();
        }

        /* ── タブのタイトル・ファビコンだけ更新 ── */
        function updateTabEl(id) {
          const tab = findTab(id);
          const el  = findTabEl(id);
          if (!tab || !el) return;

          const favicon = el.querySelector(".tab-favicon");
          const title   = el.querySelector(".tab-title");

          if (tab.loading) {
            el.classList.add("loading");
          } else {
            el.classList.remove("loading");
            if (favicon) {
              favicon.src   = tab.favicon || "";
              favicon.style.display = tab.favicon ? "" : "none";
            }
          }
          if (title) title.textContent = tab.title || "New Tab";
          el.title = tab.title || "New Tab";
          el.classList.toggle("audible", !!tab.audible && !tab.muted);
          el.classList.toggle("pinned",  !!tab.pinned);
        }

        /* ── URLバー同期 ── */
        function syncUrlBar(id) {
          const tab = findTab(id);
          if (!tab) return;
          urlInput.value = displayUrl(tab.url || "");
        }

        /* ── フレームを表示/非表示 ── */
        function showFrame(id) {
          document.querySelectorAll(".tab-frame").forEach(f => {
            f.style.display = f.id === `frame-${id}` ? "block" : "none";
          });
        }

        /* ── タブをアクティブにする ── */
        function activateTab(id) {
          if (activeId === id) return;
          const prev = findTabEl(activeId);
          if (prev) {
            prev.classList.remove("selectedTab");
            prev.setAttribute("aria-selected", "false");
          }
          activeId = id;
          const cur = findTabEl(id);
          if (cur) {
            cur.classList.add("selectedTab");
            cur.setAttribute("aria-selected", "true");
            /* アクティブタブが見えるようスクロール */
            cur.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
          }
          showFrame(id);
          syncUrlBar(id);
          updateScrollBtns();
        }

        /* ── 新規タブを作成 ── */
        function newTab(url) {
          const id  = genId();
          const tab = {
            id,
            title:   "New Tab",
            url:     url || HOME_URL,
            favicon: "",
            loading: true,
            pinned:  false,
            audible: false,
            muted:   false,
          };
          tabs.push(tab);

          /* iframe を作成 */
          const frame = document.createElement("iframe");
          frame.id          = `frame-${id}`;
          frame.className   = "tab-frame";
          frame.src         = tab.url;
          frame.style.display = "none";
          frame.sandbox     = "allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-top-navigation";
          frame.allow       = "autoplay; fullscreen; geolocation; camera; microphone";

          /* ロード完了でタイトル・ファビコン取得 */
          frame.addEventListener("load", () => {
            tab.loading = false;
            try {
              const doc    = frame.contentDocument || frame.contentWindow.document;
              tab.title    = doc.title || tab.url;
              tab.favicon  = `https://www.google.com/s2/favicons?domain=${new URL(tab.url).hostname}&sz=32`;
            } catch {
              tab.title   = tab.url;
              tab.favicon = getDefaultFavicon(tab.url);
            }
            updateTabEl(id);
            if (id === activeId) syncUrlBar(id);
          });

          tabView.appendChild(frame);
          renderTabs();
          activateTab(id);

          /* スクロールを新タブの位置へ */
          setTimeout(() => {
            const el = findTabEl(id);
            if (el) el.scrollIntoView({ block: "nearest", inline: "end", behavior: "smooth" });
          }, 50);

          return id;
        }

        /* ── タブを閉じる ── */
        function closeTab(id) {
          const idx = tabs.findIndex(t => t.id === id);
          if (idx === -1) return;

          const el = findTabEl(id);
          if (el) {
            el.classList.add("closing");
            setTimeout(() => _finishClose(id, idx), 200);
          } else {
            _finishClose(id, idx);
          }
        }

        function _finishClose(id, idx) {
          /* フレーム破棄 */
          const frame = findFrame(id);
          if (frame) frame.remove();

          tabs.splice(idx, 1);

          if (tabs.length === 0) {
            /* 全タブが閉じられたら新しいタブを開く */
            newTab();
            return;
          }

          if (activeId === id) {
            /* 隣のタブをアクティブ化 */
            const nextTab = tabs[Math.min(idx, tabs.length - 1)];
            activeId = null;
            activateTab(nextTab.id);
          }
          renderTabs();
        }

        /* ── タブを複製 ── */
        function duplicateTab(id) {
          const src = findTab(id);
          if (!src) return;
          newTab(src.url);
        }

        /* ── タブをピン留め ── */
        function togglePin(id) {
          const tab = findTab(id);
          if (!tab) return;
          tab.pinned = !tab.pinned;
          /* ピン留めタブを先頭にまとめる */
          if (tab.pinned) {
            const idx = tabs.findIndex(t => t.id === id);
            tabs.splice(idx, 1);
            const lastPin = tabs.findLastIndex ? tabs.findLastIndex(t => t.pinned) : -1;
            tabs.splice(lastPin + 1, 0, tab);
          }
          renderTabs();
        }

        /* ── タブをミュート ── */
        function toggleMute(id) {
          const tab = findTab(id);
          if (!tab) return;
          tab.muted = !tab.muted;
          const frame = findFrame(id);
          if (frame && frame.contentWindow) {
            try { frame.contentWindow.document.querySelectorAll("audio,video").forEach(m => m.muted = tab.muted); } catch {}
          }
          updateTabEl(id);
        }

        /* ── タブを並び替え ── */
        function reorderTab(fromId, toId) {
          const fi = tabs.findIndex(t => t.id === fromId);
          const ti = tabs.findIndex(t => t.id === toId);
          if (fi === -1 || ti === -1) return;
          const [moved] = tabs.splice(fi, 1);
          tabs.splice(ti, 0, moved);
          renderTabs();
        }


        function closeOtherTabs(id) {
          const toClose = tabs.filter(t => t.id !== id).map(t => t.id);
          toClose.forEach(cid => {
            const frame = findFrame(cid);
            if (frame) frame.remove();
          });
          tabs = tabs.filter(t => t.id === id);
          if (activeId !== id) {
            activeId = null;
            activateTab(id);
          }
          renderTabs();
        }


        function showCtxMenu(e, id) {
          ctxTargetId = id;
          ctxMenu.style.left = `${Math.min(e.clientX, window.innerWidth  - 220)}px`;
          ctxMenu.style.top  = `${Math.min(e.clientY, window.innerHeight - 260)}px`;
          ctxMenu.classList.add("active");

          const tab = findTab(id);
          const pinItem = document.getElementById("ctx-pin");
          if (pinItem && tab) {
            pinItem.querySelector("i").className = tab.pinned
              ? "fa-solid fa-thumbtack-slash"
              : "fa-solid fa-thumbtack";
            pinItem.childNodes[1].textContent = tab.pinned ? " ピン留めを外す" : " タブをピン留め";
          }

          const muteItem = document.getElementById("ctx-mute");
          if (muteItem && tab) {
            muteItem.querySelector("i").className = tab.muted
              ? "fa-solid fa-volume-high"
              : "fa-solid fa-volume-xmark";
            muteItem.childNodes[1].textContent = tab.muted ? " ミュート解除" : " タブをミュート";
          }
        }

        function hideCtxMenu() { ctxMenu.classList.remove("active"); }

        document.addEventListener("click",       hideCtxMenu);
        document.addEventListener("contextmenu", (e) => { if (!e.target.closest(".tab-item")) hideCtxMenu(); });

        document.getElementById("ctx-new-tab").addEventListener("click", () => { hideCtxMenu(); newTab(); });
        document.getElementById("ctx-reload").addEventListener("click", () => {
          hideCtxMenu();
          const frame = findFrame(ctxTargetId);
          if (frame) { frame.src = frame.src; }
        });
        document.getElementById("ctx-duplicate").addEventListener("click", () => { hideCtxMenu(); duplicateTab(ctxTargetId); });
        document.getElementById("ctx-pin").addEventListener("click",       () => { hideCtxMenu(); togglePin(ctxTargetId); });
        document.getElementById("ctx-mute").addEventListener("click",      () => { hideCtxMenu(); toggleMute(ctxTargetId); });
        document.getElementById("ctx-close-others").addEventListener("click", () => { hideCtxMenu(); closeOtherTabs(ctxTargetId); });
        document.getElementById("ctx-close").addEventListener("click",     () => { hideCtxMenu(); closeTab(ctxTargetId); });

        /* ── URLバー送信 ── */
        urlForm.addEventListener("submit", (e) => {
          e.preventDefault();
          let val = urlInput.value.trim();
          if (!val) return;

          if (val === HOME_DISPLAY || val === "nova://home") val = HOME_URL;


          let dest;
          try {
            dest = new URL(val.startsWith("http") ? val : `https://${val}`).href;
          } catch {
            dest = `https://www.google.com/search?q=${encodeURIComponent(val)}`;
          }

          const tab   = findTab(activeId);
          const frame = findFrame(activeId);
          if (tab && frame) {
            tab.url     = dest;
            tab.loading = true;
            tab.title   = "読み込み中...";
            tab.favicon = "";
            updateTabEl(activeId);
            frame.src = dest;
            urlInput.value = displayUrl(dest);
          }
        });

        urlInput.addEventListener("focus", () => urlInput.select());
        pageBack.addEventListener("click", () => {
          const frame = findFrame(activeId);
          try { frame && frame.contentWindow.history.back(); } catch {}
        });
        pageForward.addEventListener("click", () => {
          const frame = findFrame(activeId);
          try { frame && frame.contentWindow.history.forward(); } catch {}
        });
        pageRefresh.addEventListener("click", () => {
          const frame = findFrame(activeId);
          if (!frame) return;
          const tab = findTab(activeId);
          if (tab) { tab.loading = true; tab.title = "読み込み中..."; updateTabEl(activeId); }
          frame.src = frame.src;
        });

        newTabBtn.addEventListener("click", () => newTab());


        document.addEventListener("keydown", (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === "t") {
            e.preventDefault(); newTab();
          }
          if ((e.ctrlKey || e.metaKey) && e.key === "w") {
            e.preventDefault(); closeTab(activeId);
          }
          if ((e.ctrlKey || e.metaKey) && e.key === "Tab") {
            e.preventDefault();
            const idx     = tabs.findIndex(t => t.id === activeId);
            const nextIdx = e.shiftKey ? (idx - 1 + tabs.length) % tabs.length : (idx + 1) % tabs.length;
            activateTab(tabs[nextIdx].id);
          }

          if ((e.ctrlKey || e.metaKey) && e.key >= "1" && e.key <= "9") {
            const n = parseInt(e.key, 10) - 1;
            if (tabs[n]) activateTab(tabs[n].id);
          }
        });


        newTab(HOME_URL);
      })();
    </script>
  </body>
</html>
